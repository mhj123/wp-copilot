<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 860" role="img" aria-label="How WP Copilot works, in four steps: build a Page/Sub-page/Heading tree; add atomic notes under a Heading; the same note can link to more than one place with no copies; and AI reads whatever context you scope it to and returns proposals for chat replies, headings, or items that you accept or dismiss.">
  <title>How WP Copilot works</title>
  <style>
    .bg { fill:#ffffff; }
    .panel-bg { fill:#f6f8fa; stroke:#d0d7de; stroke-width:1; }
    .page-box { fill:#dbeafe; stroke:#2563eb; stroke-width:1.5; }
    .heading-box { fill:#dcfce7; stroke:#16a34a; stroke-width:1.5; }
    .item-box { fill:#f1f5f9; stroke:#64748b; stroke-width:1.5; }
    .item-accent-box { fill:#f1f5f9; stroke:#7c3aed; stroke-width:2; }
    .ghost-box { fill:none; stroke:#7c3aed; stroke-width:1.5; stroke-dasharray:5,4; }
    .context-box { fill:none; stroke:#6b7280; stroke-width:1.5; stroke-dasharray:6,4; }
    .accent-line { stroke:#7c3aed; stroke-width:2; fill:none; }
    .accent-dash-line { stroke:#7c3aed; stroke-width:2; stroke-dasharray:5,4; fill:none; }
    .accent-fill { fill:#7c3aed; }
    .muted-line { stroke:#9ca3af; stroke-width:1.5; fill:none; }
    .txt { fill:#1f2937; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .txt-muted { fill:#6b7280; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .tag { fill:#6b7280; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:0.06em; }
    .title-txt { fill:#1f2937; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight:700; }
    .badge-circle { fill:#1f2937; }
    .badge-text { fill:#ffffff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight:700; }
    .ai-badge { fill:#7c3aed; }
    .ai-text { fill:#ffffff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight:700; }

    @media (prefers-color-scheme: dark) {
      .bg { fill:#0d1117; }
      .panel-bg { fill:#161b22; stroke:#30363d; }
      .page-box { fill:#1e3a5f; stroke:#60a5fa; }
      .heading-box { fill:#14432a; stroke:#4ade80; }
      .item-box { fill:#21262d; stroke:#9ca3af; }
      .item-accent-box { fill:#21262d; stroke:#a78bfa; }
      .ghost-box { stroke:#a78bfa; }
      .context-box { stroke:#8b949e; }
      .accent-line { stroke:#a78bfa; }
      .accent-dash-line { stroke:#a78bfa; }
      .accent-fill { fill:#a78bfa; }
      .muted-line { stroke:#6e7681; }
      .txt { fill:#e6edf3; }
      .txt-muted { fill:#9ca3af; }
      .tag { fill:#9ca3af; }
      .title-txt { fill:#e6edf3; }
      .badge-circle { fill:#e6edf3; }
      .badge-text { fill:#0d1117; }
      .ai-badge { fill:#a78bfa; }
      .ai-text { fill:#0d1117; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" class="accent-fill" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="860" />

  <!-- ===================== Panel 1 — Structure ===================== -->
  <rect class="panel-bg" x="10" y="20" width="900" height="190" rx="10" />
  <circle class="badge-circle" cx="40" cy="40" r="16" />
  <text class="badge-text" x="40" y="45" font-size="14" text-anchor="middle">1</text>
  <text class="title-txt" x="70" y="46" font-size="15">Structure</text>
  <text class="txt-muted" x="70" y="64" font-size="11">the container tree</text>

  <rect class="page-box" x="250" y="110" width="150" height="50" rx="8" />
  <text class="tag" x="325" y="128" font-size="9" text-anchor="middle">PAGE</text>
  <text class="txt" x="325" y="144" font-size="12" text-anchor="middle" font-weight="600">Project Launch</text>

  <rect class="page-box" x="480" y="40" width="160" height="45" rx="8" />
  <text class="tag" x="560" y="56" font-size="9" text-anchor="middle">PAGE (sub-page)</text>
  <text class="txt" x="560" y="72" font-size="12" text-anchor="middle" font-weight="600">Client A</text>

  <rect class="heading-box" x="480" y="145" width="160" height="45" rx="8" />
  <text class="tag" x="560" y="161" font-size="9" text-anchor="middle">HEADING</text>
  <text class="txt" x="560" y="177" font-size="12" text-anchor="middle" font-weight="600">Research</text>

  <polyline class="muted-line" points="400,135 440,135 440,62 480,62" />
  <polyline class="muted-line" points="400,135 440,135 440,167 480,167" />

  <!-- ===================== Panel 2 — Atomic notes ===================== -->
  <rect class="panel-bg" x="10" y="230" width="900" height="190" rx="10" />
  <circle class="badge-circle" cx="40" cy="250" r="16" />
  <text class="badge-text" x="40" y="255" font-size="14" text-anchor="middle">2</text>
  <text class="title-txt" x="70" y="256" font-size="15">Atomic notes</text>
  <text class="txt-muted" x="70" y="274" font-size="11">small, reusable notes</text>

  <rect class="heading-box" x="250" y="245" width="170" height="40" rx="8" />
  <text class="tag" x="335" y="260" font-size="9" text-anchor="middle">HEADING</text>
  <text class="txt" x="335" y="276" font-size="12" text-anchor="middle" font-weight="600">Research</text>

  <line class="muted-line" x1="335" y1="285" x2="335" y2="391" />
  <line class="muted-line" x1="335" y1="315" x2="250" y2="315" />
  <line class="muted-line" x1="335" y1="353" x2="250" y2="353" />
  <line class="muted-line" x1="335" y1="391" x2="250" y2="391" />

  <rect class="item-box" x="250" y="300" width="400" height="30" rx="6" />
  <rect class="item-box" x="250" y="338" width="400" height="30" rx="6" />
  <rect class="item-box" x="250" y="376" width="400" height="30" rx="6" />
  <text class="txt" x="270" y="319" font-size="12">Task — Draft interview questions</text>
  <text class="txt" x="270" y="357" font-size="12">Note — Competitor pricing</text>
  <text class="txt" x="270" y="395" font-size="12">Note — Early user feedback</text>

  <!-- ===================== Panel 3 — Multi-association ===================== -->
  <rect class="panel-bg" x="10" y="440" width="900" height="190" rx="10" />
  <circle class="badge-circle" cx="40" cy="460" r="16" />
  <text class="badge-text" x="40" y="465" font-size="14" text-anchor="middle">3</text>
  <text class="title-txt" x="70" y="466" font-size="15">Multi-association</text>
  <text class="txt-muted" x="70" y="484" font-size="11">one note, many places</text>

  <rect class="heading-box" x="230" y="450" width="210" height="45" rx="8" />
  <text class="tag" x="335" y="466" font-size="9" text-anchor="middle">HEADING · Project Launch</text>
  <text class="txt" x="335" y="482" font-size="12" text-anchor="middle" font-weight="600">Research</text>

  <rect class="item-accent-box" x="390" y="510" width="220" height="38" rx="8" />
  <text class="tag" x="500" y="524" font-size="9" text-anchor="middle">NOTE</text>
  <text class="txt" x="500" y="539" font-size="12" text-anchor="middle" font-weight="600">Pricing insight</text>

  <rect class="heading-box" x="480" y="563" width="210" height="45" rx="8" />
  <text class="tag" x="585" y="579" font-size="9" text-anchor="middle">HEADING · Competitors</text>
  <text class="txt" x="585" y="595" font-size="12" text-anchor="middle" font-weight="600">Backlog</text>

  <line class="accent-dash-line" x1="335" y1="495" x2="430" y2="510" />
  <line class="accent-dash-line" x1="570" y1="548" x2="480" y2="563" />

  <!-- ===================== Panel 4 — AI over context ===================== -->
  <rect class="panel-bg" x="10" y="650" width="900" height="190" rx="10" />
  <circle class="badge-circle" cx="40" cy="670" r="16" />
  <text class="badge-text" x="40" y="675" font-size="14" text-anchor="middle">4</text>
  <text class="title-txt" x="70" y="676" font-size="15">AI over context</text>
  <text class="txt-muted" x="70" y="694" font-size="11">propose, never auto-apply</text>

  <rect class="context-box" x="230" y="665" width="230" height="155" rx="8" />
  <text class="tag" x="245" y="683" font-size="9">CONTEXT — any page or heading</text>
  <rect class="page-box" x="250" y="700" width="190" height="22" rx="5" />
  <text class="txt" x="345" y="715" font-size="10" text-anchor="middle">Page: Project Launch</text>
  <rect class="heading-box" x="250" y="730" width="190" height="22" rx="5" />
  <text class="txt" x="345" y="745" font-size="10" text-anchor="middle">Heading: Research</text>
  <rect class="item-box" x="250" y="760" width="190" height="22" rx="5" />
  <text class="txt" x="345" y="775" font-size="10" text-anchor="middle">Item: Pricing insight</text>

  <circle class="ai-badge" cx="500" cy="745" r="28" />
  <text class="ai-text" x="500" y="750" font-size="13" text-anchor="middle">AI</text>

  <line class="accent-line" x1="460" y1="740" x2="472" y2="745" marker-end="url(#arrow)" />
  <text class="txt-muted" x="466" y="730" font-size="9" text-anchor="middle">reads</text>

  <rect class="ghost-box" x="560" y="670" width="180" height="36" rx="6" />
  <text class="txt-muted" x="650" y="692" font-size="11" text-anchor="middle">Chat reply</text>
  <rect class="ghost-box" x="560" y="716" width="180" height="36" rx="6" />
  <text class="txt-muted" x="650" y="738" font-size="11" text-anchor="middle">+ Heading: Risks</text>
  <rect class="ghost-box" x="560" y="762" width="180" height="36" rx="6" />
  <text class="txt-muted" x="650" y="784" font-size="11" text-anchor="middle">+ Item: follow-up task</text>

  <line class="accent-line" x1="528" y1="738" x2="558" y2="688" marker-end="url(#arrow)" />
  <line class="accent-line" x1="528" y1="745" x2="558" y2="734" marker-end="url(#arrow)" />
  <line class="accent-line" x1="528" y1="752" x2="558" y2="780" marker-end="url(#arrow)" />
  <text class="txt-muted" x="540" y="712" font-size="9" text-anchor="middle">proposes</text>

  <text class="txt-muted" x="650" y="815" font-size="10" text-anchor="middle" font-style="italic">→ you accept or dismiss, nothing applies itself</text>
</svg>
