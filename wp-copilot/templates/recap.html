<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recap</title>
<base target="_top">
<style>
:root {
  --bg:#f6f7f9; --card:#fff; --ink:#1d2327; --muted:#6b7280; --line:#e5e7eb;
  --accent:#2563a8; --accent-soft:#e6eef8;
  --c1:#2563a8; --c2:#2f9e8f; --c3:#d98b2b; --c4:#8a5cc2; --c5:#c0504d;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#14171a; --card:#1d2227; --ink:#e8eaed; --muted:#9aa3ad; --line:#2d343b; --accent:#6aa7e6; --accent-soft:#223244; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
.wrap { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
header { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
h1 { font-size:22px; margin:0; }
.sub { color:var(--muted); font-size:13px; }
h2 { font-size:15px; margin:0 0 12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
.grid { display:grid; gap:16px; }
.g2 { grid-template-columns:1fr 1fr; }
@media (max-width:760px){ .g2 { grid-template-columns:1fr; } }
.totals { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; }
.tot { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
.tot b { display:block; font-size:24px; line-height:1.2; }
.tot span { color:var(--muted); font-size:12px; }
.toggle { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-bottom:12px; }
.toggle button { border:0; background:transparent; color:var(--ink); padding:4px 12px; cursor:pointer; font:inherit; font-size:12px; }
.toggle button.on { background:var(--accent); color:#fff; }
.row { display:flex; align-items:center; gap:8px; padding:5px 0; cursor:pointer; }
.row .name { width:190px; flex:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .bar { flex:1; background:var(--accent-soft); border-radius:4px; height:16px; overflow:hidden; }
.row .bar i { display:block; height:100%; background:var(--accent); border-radius:4px; transition:width .3s; }
.row .val { width:64px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
.row .caret { width:12px; color:var(--muted); font-size:10px; }
.kids { margin-left:20px; border-left:2px solid var(--line); padding-left:10px; display:none; }
.kids.open { display:block; }
.kids .row .bar i { background:var(--c2); }
.kids .row { cursor:default; }
.tag { display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px; background:var(--accent-soft); color:var(--accent); margin-left:6px; }
.tag.thin { background:#fbeede; color:#a15f10; }
.tag.stale { background:#f6e1e0; color:#a23b37; }
.stack { display:flex; height:22px; border-radius:5px; overflow:hidden; margin-bottom:8px; }
.stack i { display:block; height:100%; }
.legend { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--muted); }
.legend span::before { content:""; display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; background:var(--c); vertical-align:baseline; }
.range { margin-left:8px; }
ul.plain { list-style:none; margin:0; padding:0; }
ul.plain li { padding:6px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; }
ul.plain li:last-child { border:0; }
ul.plain small { color:var(--muted); }
.sugg { border-left:4px solid var(--accent); }
.sugg h3 { margin:0 0 4px; font-size:14px; }
.sugg p { margin:0 0 6px; }
.sugg .ev { color:var(--muted); font-size:12px; }
.sugg a { color:var(--accent); text-decoration:none; font-size:12px; }
#tip { position:fixed; pointer-events:none; background:#000c; color:#fff; font-size:12px; padding:4px 8px; border-radius:4px; display:none; z-index:9; }
svg text { fill:var(--muted); font-size:10px; }
.pages { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
@media (max-width:900px){ .pages { grid-template-columns:repeat(2,1fr); } }
@media (max-width:560px){ .pages { grid-template-columns:1fr; } }
.pcard { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:8px; }
.pcard h3 { margin:0; font-size:14px; display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.pcard .about { margin:0; }
.pcard .meta { color:var(--muted); font-size:12px; }
.pcard .latest { margin-top:auto; border-top:1px solid var(--line); padding-top:8px; font-size:12px; }
.pcard .latest b { display:block; color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
.pcard .subs { margin:4px 0 0; padding-left:16px; }
.pcard .subs li { margin:1px 0; }
.pcard .subs span { color:var(--muted); }
.pcard .latest + .latest { margin-top:0; border-top:0; padding-top:0; }
.pcard a { color:var(--accent); text-decoration:none; font-size:12px; }
.linkbtn { border:1px solid var(--line); background:var(--card); color:var(--accent); border-radius:6px; padding:5px 14px; cursor:pointer; font:inherit; font-size:12px; }
.note { font-size:12px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Recap</h1>
      <div class="sub">Generated <span id="gen"></span> · all top-level pages</div>
    </div>
    <div class="sub" id="advisory"></div>
  </header>

  <div class="totals" id="totals" style="margin-bottom:16px"></div>

  <div class="card" id="summaryCard">
    <h2>Summary</h2>
    <div id="summary"></div>
  </div>

  <h2 style="margin:20px 0 10px">Top-level pages</h2>
  <div class="pages" id="pages"></div>
  <div style="text-align:center;margin:12px 0 20px"><button class="linkbtn" id="showAll"></button></div>

  <div class="card">
    <h2>Corpus map — where the content lives</h2>
    <div class="toggle" id="metric">
      <button data-m="items" class="on">Items</button><button data-m="words">Words</button>
    </div>
    <div id="map"></div>
    <div class="note">Click an area to expand its headings. Tags flag thin or stale areas.</div>
  </div>

  <div class="grid g2">
    <div class="card">
      <h2>Item types</h2>
      <div class="stack" id="typeStack"></div>
      <div class="legend" id="typeLegend"></div>
      <h2 style="margin-top:18px">Task status</h2>
      <div class="stack" id="statusStack"></div>
      <div class="legend" id="statusLegend"></div>
    </div>
    <div class="card">
      <h2>Recent activity
        <span class="toggle range" id="range"><button data-r="7" class="on">7 days</button><button data-r="30">30 days</button></span>
      </h2>
      <svg id="spark" viewBox="0 0 400 90" width="100%" height="90" preserveAspectRatio="none"></svg>
      <div class="sub" id="actSum" style="margin:6px 0 10px"></div>
      <ul class="plain" id="active"></ul>
    </div>
  </div>

  <div class="card" id="hlCard">
    <h2>What we did recently</h2>
    <ul class="plain" id="highlights"></ul>
  </div>

  <div id="suggWrap">
    <h2 style="margin:20px 0 10px">Suggested next focus</h2>
    <div id="suggestions"></div>
  </div>
</div>
<div id="tip"></div>

<script>
// Mock snapshot. In production this JSON is produced server-side (counts, words, dates)
// plus the AI's strict-JSON summary / highlights / suggestions.
const DATA = /*__WCP_RECAP_DATA__*/null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => n.toLocaleString("en-GB");
const colors = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];
let metric = "items", range = 7;

$("#gen").textContent = DATA.generated;
$("#summary").textContent = DATA.summary || "";
$("#summaryCard").style.display = DATA.summary ? "" : "none";
$("#advisory").textContent = DATA.ai_used ? "AI-written text is advisory — nothing here changes your content." : "AI is off or unavailable — showing statistics only.";

$("#totals").innerHTML = [["Pages",DATA.totals.pages],["Headings",DATA.totals.headings],["Items",DATA.totals.items],["Words",DATA.totals.words]]
  .map(([l,v]) => `<div class="tot"><b>${fmt(v)}</b><span>${l}</span></div>`).join("");

function renderMap() {
  const key = metric === "items" ? "items" : "words", hi = metric === "items" ? 1 : 2;
  const max = Math.max(...DATA.areas.map(a => a[key]));
  const sorted = [...DATA.areas].sort((a,b) => b[key]-a[key]);
  const open = new Set([...document.querySelectorAll(".kids.open")].map(k => k.dataset.name));
  $("#map").innerHTML = sorted.map(a => {
    const hmax = Math.max(...a.headings.map(h => h[hi]), 1);
    const flag = a.flag ? `<span class="tag ${a.flag}">${a.flag}</span>` : "";
    return `<div class="row" data-name="${esc(a.name)}"><span class="caret">▶</span>
      <span class="name" title="${esc(a.name)}">${esc(a.name)}${flag}</span>
      <span class="bar"><i style="width:${a[key]/max*100}%"></i></span><span class="val">${fmt(a[key])}</span></div>
      <div class="kids ${open.has(a.name)?'open':''}" data-name="${esc(a.name)}">
      ${a.headings.map(h => `<div class="row"><span class="name" title="${esc(h[0])}">${esc(h[0])}</span>
        <span class="bar"><i style="width:${h[hi]/hmax*100}%"></i></span><span class="val">${fmt(h[hi])}</span></div>`).join("")}</div>`;
  }).join("");
}
$("#map").addEventListener("click", (e) => {
  const row = e.target.closest(".row[data-name]"); if (!row) return;
  const kids = row.nextElementSibling; kids.classList.toggle("open");
  row.querySelector(".caret").textContent = kids.classList.contains("open") ? "▼" : "▶";
});
$("#metric").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  metric = b.dataset.m;
  document.querySelectorAll("#metric button").forEach(x => x.classList.toggle("on", x === b));
  renderMap();
});

function stack(el, legend, pairs) {
  const total = pairs.reduce((s,p) => s+p[1], 0) || 1;
  $(el).innerHTML = pairs.map((p,i) => `<i style="width:${p[1]/total*100}%;background:${colors[i%5]}" data-tip="${esc(p[0])}: ${p[1]} (${Math.round(p[1]/total*100)}%)"></i>`).join("");
  $(legend).innerHTML = pairs.map((p,i) => `<span style="--c:${colors[i%5]}">${esc(p[0])} ${p[1]}</span>`).join("");
}
stack("#typeStack","#typeLegend",DATA.types);
stack("#statusStack","#statusLegend",DATA.status);

function renderActivity() {
  const d = DATA.daily30.slice(-range), max = Math.max(...d, 1), w = 400/d.length;
  $("#spark").innerHTML = d.map((v,i) => {
    const h = v/max*70;
    return `<rect x="${i*w+1}" y="${80-h}" width="${w-2}" height="${Math.max(h,1)}" rx="2" fill="var(--accent)" data-tip="${v} edits"/>`;
  }).join("") + `<text x="0" y="90">${range} days ago</text><text x="400" y="90" text-anchor="end">today</text>`;
  const total = d.reduce((s,v) => s+v, 0);
  $("#actSum").textContent = `${total} items added or edited · AI proposals: ${DATA.ai.accepted} accepted, ${DATA.ai.dismissed} dismissed`;
  const k = range === 7 ? "w" : "n";
  $("#active").innerHTML = DATA.recentAreas.map(([n,v]) => `<li><span>${esc(n)}</span><small>${range===7?v.w:v.w+v.n} edits</small></li>`).join("");
}
$("#range").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  range = +b.dataset.r;
  document.querySelectorAll("#range button").forEach(x => x.classList.toggle("on", x === b));
  renderActivity();
});

$("#hlCard").style.display = DATA.highlights.length ? "" : "none";
$("#highlights").innerHTML = DATA.highlights.map(([t,when]) => `<li><span>${esc(t)}</span><small>${esc(when)}</small></li>`).join("");
$("#suggestions").innerHTML = DATA.suggestions.map((s,i) => `<div class="card sugg"><h3>${i+1}. ${esc(s.title)}</h3>
  <p>${esc(s.why)}</p><div class="ev">Evidence: ${esc(s.ev)}</div>${s.url?`<a href="${esc(s.url)}">Open ${esc(s.link)} →</a>`:""}</div>`).join("");
$("#suggWrap").style.display = DATA.suggestions.length ? "" : "none";

// shared tooltip for any element with data-tip
const tip = $("#tip");
document.addEventListener("mousemove", (e) => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t.dataset.tip; tip.style.display = "block";
  tip.style.left = (e.clientX+12)+"px"; tip.style.top = (e.clientY+12)+"px";
});

// Top-level page cards: 6 by default (two rows of 3), "Show all" reveals the rest.
const subLink = (x) => x[1] ? `<a href="${esc(x[1])}">${esc(x[0])}</a>` : esc(x[0]);
const subList = (list, note) => (list && list.length)
  ? `<ul class="subs">${list.map(x => `<li>${subLink(x)} <span>· ${esc(note(x))}</span></li>`).join("")}</ul>` : "";
let showAll = false;
function renderPages() {
  const list = [...DATA.areas].sort((a,b) => b.items-a.items);
  const shown = showAll ? list : list.slice(0,6);
  $("#pages").innerHTML = shown.map(a => `<div class="pcard">
    <h3><span>${esc(a.name)}</span>${a.flag?`<span class="tag ${a.flag}">${a.flag}</span>`:""}</h3>
    <p class="about">${esc(a.about)}</p>
    <div class="meta">${fmt(a.subpages||0)} subpage${a.subpages===1?"":"s"} · ${a.headings.length} headings · ${fmt(a.items)} items · ${fmt(a.words)} words</div>
    <div class="latest"><b>Latest activity · ${esc(a.when)}</b>${esc(a.latest)}${subList(a.recent_subs, (x) => x[2])}</div>
    ${(a.top_subs||[]).length ? `<div class="latest"><b>Most content</b>${subList(a.top_subs, (x) => fmt(x[2]) + " items")}</div>` : ""}
    ${a.url?`<a href="${esc(a.url)}">Open page →</a>`:""}</div>`).join("");
  const btn = $("#showAll");
  btn.style.display = list.length > 6 ? "" : "none";
  btn.textContent = showAll ? "Show fewer" : `Show all ${list.length} pages`;
}
$("#showAll").addEventListener("click", () => { showAll = !showAll; renderPages(); });

renderPages(); renderMap(); renderActivity();

function reportHeight() { parent.postMessage({ wcpRecapHeight: document.documentElement.scrollHeight }, "*"); }
new ResizeObserver(reportHeight).observe(document.body);
reportHeight();
</script>
</body>
</html>
